name: Validate and deploy frontend to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_N8N_PMO_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_N8N_PMO_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Verify governed product contracts and neutrality
        run: npm run verify:governance-artifacts

      - name: Verify operational release contract
        run: npm run verify:operational-quality

      - name: Build static GitHub Pages frontend
        run: npm run build:pages

      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Test accessibility contract
        run: npm run test:accessibility
        env:
          GITHUB_PAGES: "false"
          NEXT_PUBLIC_N8N_PMO_WEBHOOK_URL: https://workflow.test/webhook/pmo
          NEXT_PUBLIC_N8N_STEERCO_WEBHOOK_URL: https://workflow.test/webhook/steerco
          NEXT_PUBLIC_N8N_STEERCO_READ_WEBHOOK_URL: https://workflow.test/webhook/steerco-read

      - name: Test browser compatibility
        run: npm run test:compatibility
        env:
          GITHUB_PAGES: "false"
          NEXT_PUBLIC_N8N_PMO_WEBHOOK_URL: https://workflow.test/webhook/pmo
          NEXT_PUBLIC_N8N_STEERCO_WEBHOOK_URL: https://workflow.test/webhook/steerco
          NEXT_PUBLIC_N8N_STEERCO_READ_WEBHOOK_URL: https://workflow.test/webhook/steerco-read

      - name: Test exported project path and runtime boundary
        run: npm run test:pages

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
